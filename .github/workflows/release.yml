name: Create Release and Publish

on:
  push:
    tags:

      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (for manual reruns)"
        required: true
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

      - name: Resolve release ref
        id: release_ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${{ github.ref_name }}"
          fi

          release_sha="$(git rev-list -n 1 "$release_tag")"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for CI on the tagged commit
        # A tag is usually pushed together with its commit, so CI may still be running; wait for it
        # (up to 60 minutes) rather than failing the artifact download below.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_ref.outputs.release_sha }}
        shell: bash
        run: |
          for _ in $(seq 1 120); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$RELEASE_SHA" --event push --limit 1 --json status,conclusion --jq '.[0] // {}')"
            status="$(jq -r '.status // empty' <<< "$run")"
            conclusion="$(jq -r '.conclusion // empty' <<< "$run")"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then exit 0; fi
              echo "::error::CI on $RELEASE_SHA finished with '$conclusion'."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $RELEASE_SHA."
          exit 1

      - name: Download artifact from tagged commit CI run
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ci.yml
          workflow_conclusion: success
          commit: ${{ steps.release_ref.outputs.release_sha }}
          name: Release
          path: ./Release/
          if_no_artifact_found: fail

      - uses: GregoryMachin/AtlassianPSVII.Standards/.github/actions/setup-powershell@c70eaec1e4d771fe56f9e0b378eda1e521db8a07 # v1.0.0

      - name: Check for PowerShell Gallery credentials
        # The fork publishes to GitHub releases; the Gallery is optional (set PSGALLERY_API_KEY to enable).
        id: gallery
        env:
          HAS_GALLERY_KEY: ${{ secrets.PSGALLERY_API_KEY != '' }}
        shell: bash
        run: echo "publish=$HAS_GALLERY_KEY" >> "$GITHUB_OUTPUT"

      - name: Publish module
        if: steps.gallery.outputs.publish == 'true'
        run: Invoke-Build -Task Publish -VersionToPublish ${{ steps.release_ref.outputs.release_tag }}
          -PSGalleryAPIKey ${{ secrets.PSGALLERY_API_KEY }}
        shell: pwsh

      - name: Package release without publishing
        if: steps.gallery.outputs.publish != 'true'
        run: Invoke-Build -Task SetVersion, Package -VersionToPublish ${{ steps.release_ref.outputs.release_tag }}
        shell: pwsh

      - name: Write release checksums
        shell: bash
        run: cd Release && sha256sum ConfluencePSVII.zip > SHA256SUMS

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_ref.outputs.release_tag }}
          name: ${{ steps.release_ref.outputs.release_tag }}
          files: |
            ./Release/ConfluencePSVII.zip
            ./Release/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.release_ref.outputs.release_tag, 'alpha') || contains(steps.release_ref.outputs.release_tag, 'beta') || contains(steps.release_ref.outputs.release_tag, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
